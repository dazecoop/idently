<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Idently</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search sessions…" autofocus />
    </div>

    <div id="groupsView">
      <div id="groupsList" class="groups"></div>
      <div id="groupsEmpty" class="empty-state hidden">No sessions yet — use the sidebar's "+ New session tab" to start one.</div>
    </div>

    <div id="searchView" class="hidden">
      <div class="list-title" id="searchResultsTitle">Results</div>
      <div id="searchResults" class="list"></div>
      <div id="searchEmptyState" class="empty-state hidden">No sessions match.</div>
    </div>

    <div id="sessionEditView" class="hidden">
      <div class="rb-header">
        <div class="rb-title">Edit session</div>
        <button class="icon-btn" id="sessionEditCloseBtn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <label class="field">
        <span class="field-label">Name</span>
        <input type="text" id="seName" maxlength="40" placeholder="e.g. Work, Client A, Personal" />
      </label>
      <label class="field">
        <span class="field-label">Notes</span>
        <textarea id="seNotes" maxlength="280" rows="2" placeholder="optional"></textarea>
      </label>
      <label class="field">
        <span class="field-label">Domain</span>
        <input type="text" id="seDomain" maxlength="200" placeholder="e.g. proton.me" />
        <span class="field-hint">Sessions with the same domain are grouped together — change this to merge a duplicate group (e.g. "account.proton.me" into "proton.me").</span>
      </label>
      <div class="field">
        <span class="field-label">Color</span>
        <div id="seSwatches" class="swatches"></div>
      </div>

      <div id="seFormError" class="form-error hidden"></div>

      <div class="rb-actions">
        <span id="seSaveStatus" class="rb-status"></span>
        <div class="rb-actions-buttons">
          <button class="btn secondary small" id="seCancelBtn">Cancel</button>
          <button class="btn primary small" id="seSaveBtn">Save</button>
        </div>
      </div>
    </div>

    <div class="footer">
      <button class="btn secondary small" id="newSessionBtn" title="Start a new session for this site">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New session tab
      </button>
      <div class="menu-anchor">
        <button class="icon-btn" id="moreMenuBtn" title="More">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <div id="moreMenu" class="menu hidden">
          <button class="menu-item" id="createRuleMenuItem">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="4"/></svg>
            Create rule for this site
          </button>
          <button class="menu-item" id="settingsMenuItem">
            <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
